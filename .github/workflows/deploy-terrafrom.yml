name: Deploy Terraform

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: deploy-terraform
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    uses: ./.github/workflows/template-plan-apply-terraform.yml
    with:
      tf_directory: 'infra'
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    outputs:
      has_changes: ${{ outputs.has_changes }} # 👈 expose the reusable workflow output

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'  # 👈 only run if there are changes
    name: Apply
    uses: ./.github/workflows/template-plan-apply-terraform.yml
    with:
      should_apply: 'true'
      release_environment: 'PROD'
      tf_directory: 'infra'
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
