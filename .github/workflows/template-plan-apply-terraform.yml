name: Template - Terraform Plan & Apply

on:
  workflow_call:
    secrets:
      AZURE_CREDENTIALS:
        required: true
      app_service_app_settings:
        description: 'App Service application settings in JSON string format'
        required: false
    inputs:
      release_environment:
        description: 'GitHub environment for release'
        default: ''
        type: string
      should_apply:
        description: 'Whether to apply the plan'
        default: 'false'
        type: string
      tf_directory:
        description: 'Terraform code directory'
        required: false
        default: '.'
        type: string
      tf_vars_file_name:
        description: 'Name of tfvars file'
        required: false
        type: string
    outputs:
      has_changes:
        description: 'Whether Terraform detected infrastructure changes'
        value: ${{ jobs.terraform.outputs.has_changes }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && '' || inputs.release_environment }}
    permissions:
      contents: read
      packages: read

    # job-level output that reads from whichever step actually ran
    outputs:
      has_changes: >-
        ${{ steps.plan_with_vars.outputs.has_changes ||
            steps.plan_without_vars.outputs.has_changes }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.6.2

      - name: Export Azure credentials for Terraform
        run: |
          echo '${{ secrets.AZURE_CREDENTIALS }}' > azurecreds.json
          echo "ARM_CLIENT_ID=$(jq -r .clientId azurecreds.json)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(jq -r .clientSecret azurecreds.json)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId azurecreds.json)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(jq -r .tenantId azurecreds.json)" >> $GITHUB_ENV
        shell: bash

      - name: Terraform Init
        run: terraform -chdir="${{ inputs.tf_directory }}" init

      - name: Terraform Validate
        run: terraform -chdir="${{ inputs.tf_directory }}" validate

      - name: Terraform Plan with var-file
        if: inputs.tf_vars_file_name != ''
        id: plan_with_vars
        shell: pwsh
        run: |
          $appSettings = '${{ secrets.app_service_app_settings }}'

          # Run the plan – no detailed exit code needed
          terraform `
            -chdir="${{ inputs.tf_directory }}" plan `
            -var-file="${{ inputs.tf_vars_file_name }}" `
            -var "app_service_app_settings=$appSettings" `
            -out=tfplan | Out-Host

          # Export the plan to JSON
          terraform -chdir="${{ inputs.tf_directory }}" show -json tfplan > plan.json

          # Count how many resources will change (create/update/delete)
          $plan = Get-Content plan.json | ConvertFrom-Json
          $changes = $plan.resource_changes | Where-Object {
            $_.change.actions -contains "create" -or
            $_.change.actions -contains "update" -or
            $_.change.actions -contains "delete"
          }

          if ($changes.Count -gt 0) {
            Write-Host "Terraform detected $($changes.Count) infrastructure change(s)"
            "has_changes=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            Write-Host "No infrastructure changes detected"
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Terraform Plan without var-file
        if: inputs.tf_vars_file_name == ''
        id: plan_without_vars
        shell: pwsh
        run: |
          $appSettings = '${{ secrets.app_service_app_settings }}'
          $tfDir = "${{ inputs.tf_directory }}"

          # Run Terraform plan with detailed exit code
          terraform -chdir="$tfDir" plan -var "app_service_app_settings=$appSettings" -detailed-exitcode -out=tfplan
          $exitCode = $LASTEXITCODE

          Write-Host "Terraform plan exit code: $exitCode"

          if ($exitCode -eq 0) {
              echo "HAS_CHANGES=false" >> $env:GITHUB_ENV
          } elseif ($exitCode -eq 2) {
              echo "HAS_CHANGES=true" >> $env:GITHUB_ENV
          } else {
              throw "Terraform plan failed with exit code $exitCode"
          }
                  


      - name: Terraform Apply (if enabled)
        if: ${{ inputs.should_apply == 'true' }}
        run: terraform -chdir="${{ inputs.tf_directory }}" apply -auto-approve tfplan
