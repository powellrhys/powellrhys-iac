name: Template - Terraform Plan & Apply

on:
  workflow_call:
    secrets:
      AZURE_CREDENTIALS:
        required: true
      app_service_app_settings:
        description: 'App Service application settings in JSON string format'
        required: false
    inputs:
      release_environment:
        description: 'GitHub environment for release'
        default: ''
        type: string
      should_apply:
        description: 'Whether to apply the plan'
        default: 'false'
        type: string
      tf_directory:
        description: 'Terraform code directory'
        required: false
        default: '.'
        type: string
      tf_vars_file_name:
        description: 'Name of tfvars file'
        required: false
        type: string
    outputs:
      has_changes:
        description: 'Whether Terraform detected infrastructure changes'
        value: ${{ jobs.terraform.outputs.has_changes }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && '' || inputs.release_environment }}
    permissions:
      contents: read
      packages: read

    # job-level output that reads from whichever step actually ran
    outputs:
      has_changes: >-
        ${{ steps.plan_with_vars.outputs.has_changes ||
            steps.plan_without_vars.outputs.has_changes }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.6.2
          terraform_wrapper: false

      - name: Export Azure credentials for Terraform
        run: |
          echo '${{ secrets.AZURE_CREDENTIALS }}' > azurecreds.json
          echo "ARM_CLIENT_ID=$(jq -r .clientId azurecreds.json)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(jq -r .clientSecret azurecreds.json)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId azurecreds.json)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(jq -r .tenantId azurecreds.json)" >> $GITHUB_ENV
        shell: bash

      - name: Terraform Init
        run: terraform -chdir="${{ inputs.tf_directory }}" init

      - name: Terraform Validate
        run: terraform -chdir="${{ inputs.tf_directory }}" validate

      - name: Terraform Plan with var-file
        if: inputs.tf_vars_file_name != ''
        id: plan_with_vars
        shell: bash
        run: |
          set +e
          terraform -chdir="${{ inputs.tf_directory }}" plan \
            -var-file="${{ inputs.tf_vars_file_name }}" \
            -var "app_service_app_settings=${{ secrets.app_service_app_settings }}" \
            -detailed-exitcode \
            -out=tfplan
          exitcode=$?

          set -e
          echo "Terraform exit code: $exitcode"

          if [ "$exitcode" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ "$exitcode" -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Terraform plan failed with exit code $exitcode"
            exit 1
          fi

      - name: Terraform Plan without var-file
        if: inputs.tf_vars_file_name == ''
        id: plan_without_vars
        shell: bash
        run: |
          set +e
          terraform -chdir="${{ inputs.tf_directory }}" plan \
            -var "app_service_app_settings=${{ secrets.app_service_app_settings }}" \
            -detailed-exitcode \
            -out=tfplan
          exitcode=$?

          set -e
          echo "Terraform exit code: $exitcode"

          if [ "$exitcode" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ "$exitcode" -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Terraform plan failed with exit code $exitcode"
            exit 1
          fi

      - name: Terraform Apply (if enabled)
        if: ${{ inputs.should_apply == 'true' }}
        run: terraform -chdir="${{ inputs.tf_directory }}" apply -auto-approve tfplan
